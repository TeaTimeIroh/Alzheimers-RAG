# Postgres 16 with the pgvector extension preinstalled.
#   start:  docker compose up -d
#   stop:   docker compose down        (data is kept in the "pgdata" volume)
#   wipe:   docker compose down -v
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      # host port 5433 -> container port 5432. Not 5432 on the host: a locally installed
      # PostgreSQL usually already owns that port and would answer instead of this container.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
